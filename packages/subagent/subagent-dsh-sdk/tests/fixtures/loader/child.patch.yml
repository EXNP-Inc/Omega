# SDK-profile patch for the child runtime in the cwd-inheritance proof.

- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- id: system-prompt
  name: '@omega-ai/dsh-system-prompt'
  config:
    personaPrefix: 'Echo where you run.'

- id: agent-instructions
  name: '@omega-ai/dsh-agent-instructions'
  disabled: true

- id: skill-filesystem
  name: '@omega-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@omega-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: child-mock-llm
      name: './child-mock-llm.ts'
