- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- id: agent-default-model
  name: '@omega-ai/dsh-agent-default-model'
  config:
    provider: omega-official
    model: omega-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@omega-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@omega-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@omega-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash
                inputModalities: [text]
              - id: omega-v4-pro
                inputModalities: [text]
              - id: omega-v4-flash-vision-exp
                inputModalities: [text, image]

- id: attachment-local
  name: '@omega-ai/dsh-attachment-local'

- insert:
    - id: browser-use
      name: '@omega-ai/dsh-browser-use'
    - id: native-browser-use-fixture
      name: './native-fixture.mjs'
