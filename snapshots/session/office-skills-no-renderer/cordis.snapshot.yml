- id: llm-omega
  disabled: true

- insert:
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 8192
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high

- insert:
    - id: office-skills
      name: '@omega-ai/dsh-skill-office'
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        cli: false

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
