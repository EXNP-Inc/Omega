# Retry-scenario overlay: pin the bounded transient retry policy to a
# deterministic 1 ms zero-jitter delay so the durable `llm/retry` event
# (`delayMs`) and replay wall time stay reproducible. The overlay changes no
# tool or prompt composition, so its scenarios share the default header class.
# Config patches replace whole plugin configs: the provider patch restates its
# adapter fields around `retryPolicy`, while the app patch re-pins the recorded
# flash model and restates its base fields.
- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  config:
    thinking: enabled
    reasoningEffort: max
    retryPolicy:
      mode: normal
      maxRetries: 2
      backoff:
        initialDelayMs: 1
        maxDelayMs: 1
        jitterRatio: 0
    models:
      - id: omega-v4-flash
      - id: omega-v4-pro

- id: agent-default-model
  name: '@omega-ai/dsh-agent-default-model'
  config:
    provider: omega-official
    model: omega-v4-flash

- id: session-persistence-jsonl
  name: '@omega-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@omega-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@omega-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.
