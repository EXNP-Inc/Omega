# Keyless replay counterpart: the failed search remains real; only the
# conversation model adapter is replaced by replay.
- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- id: plugin-package-inventory-omega
  disabled: true

- insert:
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: omega-v4-pro

    - id: web-search-error-fixture
      name: './web-search-error-fixture.mjs'

- id: web-omega-api
  name: '@omega-ai/dsh-web-omega-api'
  config:
    searchApiKeyEnv: DSH_SNAPSHOT_SEARCH_KEY
    # The fixture maps this recorded authority to its OS-assigned listener.
    searchBaseURL: http://127.0.0.1:43118/api/v1/tools

# The conversation runs on a Omega model route, where an unconfigured search selects Messages search.
- id: web
  name: '@omega-ai/dsh-web'
  config:
    searchProvider: omega-search-api
    fetchProvider: http
