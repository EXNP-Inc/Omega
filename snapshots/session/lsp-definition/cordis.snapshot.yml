# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- insert:
    - id: lsp
      name: '@omega-ai/dsh-lsp'
    - id: lsp-stdio
      name: '@omega-ai/dsh-lsp-stdio'
      config:
        servers:
          fixture:
            command: !!js process.execPath
            args: ['./lsp-server.mjs']
            extensionToLanguage:
              '.ts': typescript
    - id: tool-lsp
      name: '@omega-ai/dsh-tool-lsp'
      config:
        maxLocations: 1
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash
              - id: omega-v4-pro

- id: timeout-policy
  name: '@omega-ai/dsh-tool-call-timeout-policy'

- id: plugin-package-inventory-omega
  disabled: true
