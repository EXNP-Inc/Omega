# Keyless PTC mode combines the runtime/registry changes with the
# Omega-to-replay swap in one profile patch.
- insert:
    - id: literal-sdk
      name: '../../../packages/core/tools/tests/fixtures/literal-sdk.ts'

- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- id: plugin-package-inventory-omega
  disabled: true

- id: agent-default-model
  name: '@omega-ai/dsh-agent-default-model'
  config:
    provider: omega-official
    model: omega-v4-flash

- id: session-persistence-jsonl
  name: '@omega-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@omega-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

- id: system-prompt
  name: '@omega-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash
              - id: omega-v4-pro
              - id: omega-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
