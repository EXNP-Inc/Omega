# Keyless replay counterpart: the account stand-in and Search endpoint remain real; only the model adapter is
# replaced by replay.
- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- id: llm-omega-account
  disabled: true

- id: plugin-package-inventory-omega
  disabled: true

- insert:
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: snapshot-other
            name: Other provider
            models:
              - id: other-model

    - id: web-search-billing-fixture
      name: '../web-search-account-billing/web-search-billing-fixture.mjs'

- id: web-omega-api
  name: '@omega-ai/dsh-web-omega-api'
  config:
    searchBilling: api-key
