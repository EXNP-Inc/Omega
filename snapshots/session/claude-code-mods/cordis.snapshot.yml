# Replay patch for the Claude Code mods composition: the default composition's
# replay delta plus the bridge and mods. The model script comes from the
# scenario's committed session JSONL.

- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- id: plugin-package-inventory-omega
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@omega-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@omega-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: claude-code-mods
      name: '@omega-ai/dsh-experimental-claude-code-mods'
    - id: claude-code-mod-snapshot-guard
      name: './demo-mod.ts'
    - id: claude-code-mod-replay-theater
      name: '@omega-ai/dsh-experimental-claude-code-mods/examples/replay-theater/index.ts'
    - id: claude-code-mod-token-weather
      name: '@omega-ai/dsh-experimental-claude-code-mods/examples/token-weather/index.ts'
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              # The live route's published facts, so replay reconstructs the recorded request header.
              - id: omega-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
              - id: omega-v4-pro
          - id: omega-messages
            name: Omega Messages
            models:
              - id: omega-v4-flash
              - id: omega-v4-pro
