# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  config:
    models:
      - id: omega-v4-pro

- id: subprocess
  name: '@omega-ai/dsh-subprocess-local'

- id: bash-sandbox
  name: '@omega-ai/dsh-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@omega-ai/dsh-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@omega-ai/dsh-shell-env'

- id: agent-default-model
  name: '@omega-ai/dsh-agent-default-model'
  config:
    provider: omega-official
    model: omega-v4-pro

- id: session-persistence-jsonl
  name: '@omega-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@omega-ai/dsh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@omega-ai/dsh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: goal
  name: '@omega-ai/dsh-goal'
  disabled: true

- id: goal-round-driver
  name: '@omega-ai/dsh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@omega-ai/dsh-command-goal'
  disabled: true

- id: tool-goal
  name: '@omega-ai/dsh-tool-goal'
  disabled: true

- id: skill
  name: '@omega-ai/dsh-skill'
  disabled: true

- id: skill-filesystem
  name: '@omega-ai/dsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@omega-ai/dsh-tool-skill'
  disabled: true

- id: tool-bash
  name: '@omega-ai/dsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@omega-ai/dsh-tool-pwsh'
  disabled: false
