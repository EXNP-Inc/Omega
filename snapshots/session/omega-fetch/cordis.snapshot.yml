# Keyless replay counterpart: deterministic HTTP remains real; only the model
# adapter is replaced by replay.
- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash
              - id: omega-v4-pro

    - id: omega-fetch-fixture
      name: './omega-fetch-fixture.mjs'

- id: web
  name: '@omega-ai/dsh-web'
  config:
    searchProvider: omega-search-api
    fetchProvider: deepseek-fetch-api

- id: web-omega-api
  name: '@omega-ai/dsh-web-omega-api'
  config:
    fetchApiKeyEnv: DSH_SNAPSHOT_FETCH_KEY
    fetchBaseURL: http://127.0.0.1:43118/api/v1/tools

- id: tool-web
  name: '@omega-ai/dsh-tool-web'
  config:
    search: false
