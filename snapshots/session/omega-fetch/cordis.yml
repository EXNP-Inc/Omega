- insert:
    - id: deepseek-fetch-fixture
      name: './deepseek-fetch-fixture.mjs'

- id: web
  name: '@omega-ai/dsh-web'
  config:
    searchProvider: omega-search-api
    fetchProvider: deepseek-fetch-api

- id: web-omega-api
  name: '@omega-ai/dsh-web-omega-api'
  config:
    fetchApiKeyEnv: DSH_SNAPSHOT_FETCH_KEY
    fetchBaseURL: http://127.0.0.1:43118/api/v1/tools

- id: tool-web
  name: '@omega-ai/dsh-tool-web'
  config:
    search: false
