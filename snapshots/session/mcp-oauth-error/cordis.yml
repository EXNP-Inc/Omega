- id: llm-omega
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: omega-flash

# The OAuth grant lives in the credential store, which the headless profile disables.
- id: credentials
  disabled: false

- insert:
    - id: mcp-oauth-error
      name: '@omega-ai/dsh-mcp-client'
      inject: [credentials]
      config:
        transport: streamable-http
        serverName: protected
        url: !!js process.env.DSH_MCP_DEMO_URL
        oauth:
          credentialKey: mcp-client/snapshot
        expandTemplates: true
        failOnStartupError: true
        reconnect:
          enabled: false
