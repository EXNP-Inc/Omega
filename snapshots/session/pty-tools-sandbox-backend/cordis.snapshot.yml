# Keyless replay counterpart to pty.cordis.yml.
- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- insert:
    - id: pty
      name: '@omega-ai/dsh-terminal'
    - id: pty-snapshot-backend
      name: './pty-snapshot-backend.mjs'
    - id: tool-terminal
      name: '@omega-ai/dsh-tool-terminal'
      config:
        maxResultBytes: 64
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash
              - id: omega-v4-pro

- id: plugin-package-inventory-omega
  disabled: true
