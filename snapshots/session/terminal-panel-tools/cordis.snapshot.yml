# Keyless replay counterpart to cordis.yml.
- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- insert:
    - id: terminal-controller-fixture
      name: './terminal-controller-fixture.mjs'
    - id: optional-persistent-terminals
      name: cordis:group
      group: true
      isolate:
        terminals: true
      config:
        - id: pty
          name: '@omega-ai/dsh-terminal'
        - id: terminal-panel
          name: '@omega-ai/dsh-terminal-panel'
        - id: tool-terminal
          name: '@omega-ai/dsh-tool-terminal'
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash
              - id: omega-v4-pro

- id: plugin-package-inventory-omega
  disabled: true
