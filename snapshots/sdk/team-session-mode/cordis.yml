# TypeScript SDK snapshot-record patch over `dsh --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@omega-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@omega-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@omega-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- insert:
    - id: agent-team
      name: '@omega-ai/dsh-agent-team'
    - id: tool-agent-team
      name: '@omega-ai/dsh-tool-agent-team'
    - id: team-session-mode-fixture
      name: ../../../packages/team/agent-team/tests/session-mode-fixture.ts
