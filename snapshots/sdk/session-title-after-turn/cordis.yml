# Session-title snapshot composition: the optional first-prompt provider uses
# the ordinary Omega route while the every other capability stay
# identical to the base example.
- insert:
    - id: session-title-provider
      name: '@omega-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: omega-official
        model: omega-v4-flash
