- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-flash
                inputModalities: [text, image]
                contextWindow: 1000000

- id: compaction-basic
  config:
    thresholdRatio: 0.001
    headroomTokens: 256
    retainTokens: 64
    maxTokens: 256
