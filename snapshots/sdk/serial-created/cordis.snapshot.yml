# Keyless TypeScript SDK replay patch over the live profile patch.

- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash

- id: session-log-omega
  name: '@omega-ai/dsh-session-log-omega'
  config:
    enabled: true
