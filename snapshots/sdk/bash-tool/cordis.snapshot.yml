# Keyless replay layer for the ordinary SDK snapshot composition.

- id: llm-omega
  name: '@omega-ai/dsh-llm-omega-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@omega-ai/dsh-llm-replay'
      config:
        providers:
          - id: omega-official
            name: Omega
            models:
              - id: omega-v4-flash

- id: session-log-omega
  config:
    enabled: false
