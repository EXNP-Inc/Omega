[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "omega-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled dsh CLI runtime for the Omega Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Omega" }]

[project.urls]
Homepage = "https://github.com/omega-ai/omega-harness"
Documentation = "https://github.com/omega-ai/omega-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/omega-ai/omega-harness/issues"
Source = "https://github.com/omega-ai/omega-harness"

[project.scripts]
dsh = "omega_harness_runtime:main"

# Include the injected dsh executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/omega_harness_runtime/runtime/omega-harness-sdk-runtime-*",
  "src/omega_harness_runtime/runtime/omega-harness-sdk-runtime-*/**",
  "src/omega_harness_runtime/runtime/linux-*/**",
  "src/omega_harness_runtime/runtime/macos-*/**",
  "src/omega_harness_runtime/runtime/win-*/**",
]
exclude = ["src/omega_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/omega_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
